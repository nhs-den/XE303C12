# ============================================================================
#  XE303OS - konfigurasi build
#  Di-source oleh semua script di build/ dan tools/.
#  Override tanpa mengedit file ini: buat config/build.local.conf (gitignored)
#  atau lewat environment, contoh:
#      make SUITE=bookworm DESKTOP=xfce image
# ============================================================================

# --- Identitas distro -------------------------------------------------------
DISTRO_NAME="xe303os"
DISTRO_LABEL="XE303OS"
DISTRO_ID="xe303os"
VERSION="1.0.0"

# --- Basis Debian -----------------------------------------------------------
# trixie  = Debian 13, kernel 6.12, didukung sampai ~2030  (default)
# bookworm= Debian 12, kernel 6.1,  LTS sampai 2028, lebih kecil/lebih tenang
SUITE="trixie"
# Exynos 5250 = ARMv7 dengan hard-float => armhf.
# PERINGATAN: amd64/i386 TIDAK akan pernah boot di perangkat ini.
ARCH="armhf"
DEBIAN_MIRROR="http://deb.debian.org/debian"
SECURITY_MIRROR="http://security.debian.org/debian-security"
COMPONENTS="main contrib non-free non-free-firmware"
APT_RECOMMENDS="no"           # "yes" kalau mau image lebih gemuk & nyaman
APT_RETRIES="5"
LOCALE="id_ID.UTF-8"
COUNTRY="ID"

# Kernel: Debian multiplatform ARMv7. Meta-package -> selalu kernel terbaru suite.
KERNEL_META="linux-image-armmp"
# Paket DTB/kernel tempat mencari image + .dtb (diisi otomatis oleh 60-bootimg.sh
# dari /boot/<kver> jika dibiarkan kosong).
KERNEL_FLAVOUR="armmp"
# Kompresi ulang kernel untuk partisi boot lama (u-boot H2C / depthcharge lama).
# Diambil dari /boot/config-* (CONFIG_KERNEL_LZMA/GZIP/LZO). auto = deteksi.
KERNEL_COMPRESS="auto"

# --- Target hardware --------------------------------------------------------
# "snow"  : Samsung Chromebook Series 3/5 ARM (Exynos 5250)  -> XE303C12
# "peach" : Samsung Chromebook 2 (Exynos 5420/5800)
BOARD="snow"

# Kandidat DTB, dicoba berurutan; yang ada di /usr/lib/linux-image-<kver>/ dipakai.
# Unit XE303C12 dilaporkan beredar dalam 2 revisi, jadi kita sertakan semuanya.
DTB_CANDIDATES="exynos5250-snow.dtb exynos5250-snow-rev5.dtb exynos5250-spring.dtb exynos5800-peach-pi.dtb"
# Semua kandidat ikut dipaket ke partisi boot (u-boot/deptcharge memilih yang cocok).
DTB_PACK_ALL="yes"

# Firmware WiFi (Marvell 88W8797 -> mrvl/sd8797_uapsta.bin) dan lainnya.
FIRMWARE_PACKAGES="firmware-libertas firmware-marvell firmware-misc-nonfree firmware-realtek"

# --- Boot chain -------------------------------------------------------------
# uboot-extlinux : partisi KERN-A/B berisi U-Boot chainloading, lalu boot
#                  dari partisi BOOT via /extlinux/extlinux.conf  <- DIREKOMENDASIKAN
#                  untuk Chromebook Exynos 5250 (firmur = U-Boot H2C, bukan
#                  coreboot/depthcharge; kernel vboot langsung sering ditolak:
#                  2x bip lalu kembali ke ChromeOS).
# vboot-direct   : partisi KERN-A/B berisi kernel+initrd+dtb yang dipaket
#                  mkdepthcharge (vboot). Hanya jika U-Boot tidak tersedia.
BOOT_MODE="uboot-extlinux"

# U-Boot chainloading (prebuilt). Kosongkan untuk build sendiri dari sumber.
UBOOT_PREBUILT_URL="http://commondatastorage.googleapis.com/chromeos-localmirror/distfiles/nv_uboot-snow.kpart.bz2"
UBOOT_PREBUILT_SHA256=""           # kosong = checksum dicetak supaya bisa diverifikasi manual
UBOOT_GIT_URL="https://github.com/hexdump0815/u-boot-chainloading-for-arm-chromebooks"
UBOOT_DEFCONFIG="snow_defconfig"   # mainline u-boot configs/snow_defconfig
UBOOT_BUILD_FROM_SOURCE="no"

# Lokasi file di dalam partisi BOOT (dibaca oleh u-boot).
EXTLINUX_DIR="extlinux"
BOOT_LABEL="XE303_BOOT"
ROOTFS_LABEL="XE303_ROOT"

# --- Layout partisi (MiB) ---------------------------------------------------
KERN_PART_MB="16"                  # u-boot.bin cuma ~1MB; 16MB = ukuran standar ChromeOS
KERN_PART_MB_VBOOT="128"           # kernel+initramfs vboot butuh lebih besar
BOOT_PART_MB="192"                 # /boot (vmlinuz + initrd + dtb + uImage), ext2
ROOT_PART_MB="3400"                # rootfs; diluaskan otomatis saat boot pertama
ROOT_FS="ext4"
BOOT_FS="ext2"
SECTOR="512"
FIRST_LBA="2048"

# UUID tetap agar image yang di-dd ke disk mana pun tetap boot.
# JIKA menginstal ke 2 perangkat sekaligus, jalankan tools/unique-ids.sh.
ROOTFS_UUID="a5b3c1d7-6f42-4a58-9c1e-584530334f53"
ROOTFS_PARTUUID="b6c4d2e8-7a53-4b69-8d2f-584530334f53"
BOOT_PARTUUID="c7d5e3f9-8b64-4c7a-9e30-584530334f53"

# --- Isi sistem -------------------------------------------------------------
HOSTNAME="xe303os"
TIMEZONE="Asia/Jakarta"
KEYMAP="us"
USERNAME="user"
USERFULLNAME="XE303 User"
USERPASS="xe303os"                  # GANTI di produksi / gunakan --passwd
ROOTPASS="xe303os"
AUTologin="yes"                     # auto-login via lightdm utk user pertama (nyaman utk perangkat pribadi)
DESKTOP="lxqt"                      # lxqt | xfce | openbox  (lihat config/packages/)
BROWSER="firefox-esr"               # firefox-esr | none  (2GB RAM: harap hemat tab)
ZRAM_SIZE_MB="1024"                 # swap terkompresi; RAM cuma 2GB
SWAPFILE_MB="0"                     # 0 = tidak ada swap di eMMC (hemat wear)
EARLYOOM="yes"                      # bunuh proses raksaat saat OOM, lebih baik dari freeze
SSH="enable"                        # enable | disable
WIFI_SSID=""                        # isi untuk auto-connect headless (NetworkManager keyfile)
WIFI_PASSPHRASE=""

# --- Output -----------------------------------------------------------------
WORK_DIR="${ROOT_DIR}/work"
DIST_DIR="${ROOT_DIR}/dist"
CACHE_DIR="${WORK_DIR}/apt-cache"
COMPRESS="xz"                       # xz | gz | none
IMAGE_STEM="${DISTRO_NAME}-${VERSION}-${BOARD}-${SUITE}"
ISO_LABEL="${DISTRO_LABEL}_${VERSION}"
