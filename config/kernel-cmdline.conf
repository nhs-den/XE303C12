# Parameter kernel. Satu per baris. Baris diawali '#' diabaikan.
# root= ditambahkan otomatis oleh build/lib/layout.sh (root=UUID=... rootwait).

# Konsol: tanpa serial (mod UART = solderan; lihat docs/hardware.md)
console=tty1

# Exynos 5250: clock yang tidak "dipakai" konsumen harus tetap hidup saat boot,
# kalau tidak panel/LVDS bridge (NXP PTN3460) tidak pernah diinisialisasi.
clk_ignore_unused

# Alokasi CMA + pool koheren untuk exynos-drm (tanpa GPU driver mainline utk Mali-T604,
# jadi framebuffer-nya CMA dari DRAM; nilai kecil hemat RAM 2GB).
cma=64M
coherent_pool=1M

# Cortex-A15 r0p0/r0p1 perlu workaround errata 773022 (sudah dibenahi di kernel
# Debian; dipakai di sini untuk kernel build sendiri).
# Diaktifkan lewat config kernel, bukan cmdline.

# ARMv7 3G/1G user/kernel split + DRM bisa kekurangan vmalloc area pada 2GB RAM.
vmalloc=256M

# Soft-lockup detector butuh timer per-CPU; di 2-core Cortex-A15 itu cuma
# menambah noise (dan pernah memicu watchdog false-positive saat build besar).
nosoftlockup

# Jangan biarkan printk console memperlambat boot di 1366x768 fbcon
quiet log_buf_len=2M
