# XE303OS - tuning untuk RAM 2 GiB + eMMC 16 GiB
# Hemat tulis ke eMMC: kurangi frekuensi flush & cache tetap di RAM
vm.swappiness=100
vm.vfs_cache_pressure=500
vm.min_free_kbytes=16384
vm.dirty_writeback_centisecs=1500
vm.dirty_expire_centisecs=3000
vm.dirty_ratio=20
vm.dirty_background_ratio=5
# zram butuh overcommit wajar
vm.overcommit_memory=0
# vfork/oom: biarkan earlyoom yang bertindak, bukan OOM-killer acak
vm.oom_dump_tasks=0
# jaringan: buffer kecil (RAM terbatas)
net.core.rmem_max=4194304
net.core.wmem_max=4194304
net.ipv4.tcp_rmem="4096 131072 4194304"
net.ipv4.tcp_wmem="4096 131072 4194304"
net.ipv4.tcp_mtu_probing=1
# matikan redirect (jaringan Chromebook sering di belakang gateway HP)
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.default.accept_redirects=0
# kernel panic -> reboot, berguna saat keadaaan headless
kernel.panic=10
kernel.panic_on_oops=0
# hemat log
kernel.printk="4 4 1 7"
