# XE303OS - NetworkManager utk Marvell 88W8797 (mwifiex_sdio) di Exynos 5250
[connection]
# jangan pakai WiFi powersave: mwifiex kehilangan asosiasi saat PS on
wifi.powersave = 2

[device]
wifi.scan-rand-mac-address=no

[connectivity]
# matikan captive-portal check (tidak ada server Debian utk check + bikin trafik)
uri=
interval=0

[main]
# DNS: biarkan systemd-resolved kalau ada, kalau tidak pakai DHCP langsung
dhcp=internal
ipv6.privacy=disabled
